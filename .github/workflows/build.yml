name: Build
on:
  push:
    paths:
      - 'Cosy Craft Launcher/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Cosy Craft Launcher/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:
       matrix:
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Replace
      run: |
        (gc "Cosy Craft Launcher\Modules\ModSecret.vb") -replace 'Public OAuthClientId As String = .*', 'Public OAuthClientId As String = If("${{ secrets.CLIENT_ID }}" <> "", "${{ secrets.CLIENT_ID }}", If(Environment.GetEnvironmentVariable("COSY_MS_CLIENT_ID") <> "", Environment.GetEnvironmentVariable("COSY_MS_CLIENT_ID"), If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")))' | Out-File "Cosy Craft Launcher\Modules\ModSecret.vb"
        (gc "Cosy Craft Launcher\Modules\ModSecret.vb") -replace 'Public CurseForgeAPIKey As String = .*', 'Public CurseForgeAPIKey As String = If("${{ secrets.CURSEFORGE_API_KEY }}" <> "", "${{ secrets.CURSEFORGE_API_KEY }}", If(Environment.GetEnvironmentVariable("COSY_CURSEFORGE_API_KEY") <> "", Environment.GetEnvironmentVariable("COSY_CURSEFORGE_API_KEY"), If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")))' | Out-File "Cosy Craft Launcher\Modules\ModSecret.vb"
        (gc "Cosy Craft Launcher\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Out-File "Cosy Craft Launcher\Modules\Base\ModBase.vb"

    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Cosy Craft Launcher\Cosy Craft Launcher.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Cosy Craft Launcher\obj\${{ matrix.configuration }}\Cosy Craft Launcher.exe
